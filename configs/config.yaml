data:
  train_path: "data/final/train.csv"
  test_path: "data/final/test.csv"
  target_col: "condition"
  drop_cols: ["datasetId"]

experiments:
  balancing_strategies:
    - "none"
    - "smote"
    - "adasyn"
  models:
    - "cnn1d"
    - "lstm"
    - "cnn_lstm"

model_params:
  cnn1d:
    hidden_channels: [64, 128]
    kernel_size: 3
    dropout: 0.3
  lstm:
    hidden_size: 64
    num_layers: 2
    dropout: 0.3
  cnn_lstm:
    cnn_channels: [32, 64]
    lstm_hidden: 64
    dropout: 0.3

training:
  batch_size: 256
  learning_rate: 0.001
  epochs: 5
  save_dir: "models/saved_models"
  reports_dir: "reports"
