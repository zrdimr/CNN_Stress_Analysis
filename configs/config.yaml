data:
  train_path: "data/final/train.csv"
  test_path: "data/final/test.csv"
  target_col: "condition"
  drop_cols: ["datasetId"]

experiments:
  balancing_strategies:
    - "none"
    - "smote"
    - "adasyn"
  models:
    - "cnn1d"
    - "cnn2d"
    - "fusion"

model_params:
  cnn1d:
    hidden_channels: [64, 128]
    kernel_size: 3
    dropout: 0.3
  cnn2d:
    hidden_channels: [32, 64]
    kernel_size: 3
    dropout: 0.3
  fusion:
    hidden_channels: [64, 128]

training:
  batch_size: 256
  learning_rate: 0.001
  epochs: 5  # Kept small for fast iteration; user can increase
  save_dir: "models/saved_models"
  reports_dir: "reports"
