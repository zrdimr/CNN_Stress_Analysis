name: Parallel CNN+LSTM Research

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-research-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [cnn1d, lstm, cnn_lstm]
        balancing: [none, smote, adasyn]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Model: ${{ matrix.model }} | Balancing: ${{ matrix.balancing }}
      run: |
        mkdir -p models/saved_models
        mkdir -p reports
        python main.py --model ${{ matrix.model }} --balancing ${{ matrix.balancing }}

    - name: Upload Run Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: isolated-result-${{ matrix.model }}-${{ matrix.balancing }}
        path: |
          reports/
          models/saved_models/${{ matrix.model }}_${{ matrix.balancing }}/
      continue-on-error: true

  aggregate-reports:
    needs: run-research-matrix
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Download all isolated results
      uses: actions/download-artifact@v4
      with:
        path: artifacts_download

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Merge Artifacts into Reports folder
      run: |
        mkdir -p reports
        # Artifacts download as artifacts_download/isolated-result-MODEL-BALANCING/reports/...
        find artifacts_download -type f -name "*_result.json" -exec cp {} reports/ \;
        find artifacts_download -type f -name "*.png" -exec cp {} reports/ \;
        find artifacts_download -type f -name "*.txt" -exec cp {} reports/ \;

    - name: Generate Professor Report
      run: python main.py --aggregate
        
    - name: Upload Final Consolidated Report
      uses: actions/upload-artifact@v4
      with:
        name: FINAL_RESEARCH_OUTPUT
        path: reports/
